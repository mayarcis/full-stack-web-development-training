
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Animation</h1>

    <div class="grid">
        <div class="card fade-in"></div>
        <div class="card slide-left"></div>
        <div class="card bounce" ></div>
        <div class="card pulse"></div>
        <div class="card rotate"></div>
        <div class="card glow"></div>

    </div>
    <br> <br>

    <<h1>Transform</h1>

<div class="box translate"></div>
<div class="box scale"></div>
<div class="box rotate"></div>
<div class="box skew"></div>
<div class="box scaleX"></div>
<div class="box scaleY"></div>
</body>
</html>
